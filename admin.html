<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Makka Pharma | Content Dashboard</title><style>:root{font-family:system-ui,sans-serif;color:#261b30;background:#f6f5f7}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:0 auto;padding:38px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #e6e1e9;padding-bottom:22px;margin-bottom:32px}h1{font-size:clamp(24px,3vw,34px);margin:0}h2{font-size:19px}small,.muted{color:#77717e}button{cursor:pointer;border:0;border-radius:10px;padding:11px 17px;font-weight:700;background:#432955;color:white}button.secondary{background:#e8e2ed;color:#3b2646}input,select,textarea{display:block;width:100%;border:1px solid #dcd5e1;border-radius:10px;padding:12px;font:inherit;margin:7px 0 16px}label{font-size:13px;font-weight:700}.card{background:#fff;border:1px solid #e8e3ec;border-radius:17px;padding:25px;margin:20px 0;box-shadow:0 9px 30px #30203a08}.auth{max-width:450px;margin:10vh auto}.hidden{display:none!important}.tabs{display:flex;gap:9px;flex-wrap:wrap}.tabs button[aria-selected="false"]{background:#ebe6ee;color:#3b2646}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.item strong{display:block}.item span{font-size:12px;color:#827b88}.actions{display:flex;gap:7px}.status{font-size:13px;min-height:18px;margin:10px 0}.error{color:#a32842}@media(max-width:750px){.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}</style></head><body><div class="shell"><header><div><small>MAKKA PHARMA · CONTENT MANAGEMENT</small><h1>Website Dashboard</h1></div><button id="logout" class="secondary hidden">Sign out</button></header><section id="setup" class="card hidden"><h2>Backend connection required</h2><p>Dashboard files are ready. Create a dedicated Makka Pharma Supabase project and configure <code>cms/config.js</code> to activate secure login and content management.</p></section><section id="login" class="card auth hidden"><h2>Admin sign in</h2><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form></section><section id="dashboard" class="hidden"><div class="tabs"><button data-tab="products" aria-selected="true">Products</button><button data-tab="partners" aria-selected="false">Partners</button><button data-tab="inquiries" aria-selected="false">Inquiries</button></div><div class="layout"><section class="card"><h2 id="editor-title">Add product</h2><form id="editor-form"><label>Name<input id="item-name" required maxlength="150"></label><label>Category<input id="item-category" maxlength="100"></label><label>Image URL<input id="item-image" type="url" placeholder="https://…"></label><label>Description<textarea id="item-description" rows="4" maxlength="2500"></textarea></label><label><input id="item-published" type="checkbox" checked style="display:inline;width:auto"> Published</label><div class="actions"><button type="submit">Save</button><button type="button" id="reset" class="secondary">Clear</button></div></form></section><section class="card"><h2 id="list-title">Products</h2><div id="items"></div></section></div></section><p id="status" class="status" role="status" aria-live="polite"></p></div><script type="module" src="cms/admin.js"></script></body></html>
